<html lang="en">
<head>
<meta charset="utf-8"/>

<title>CellDot Shop — Mobile Shop Management</title>

<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js"></script>

<style>
:root{--bg:#0b0b0d;--panel:#141416;--panel2:#1b1b1f;--line:#2a2a30;--gold:#d4af37;--gold2:#f0d47a;--gold-dim:#8a742a;--text:#f3f1e9;--muted:#a7a49a;--red:#e5604f;--green:#3fbf7f;--amber:#e8a33d;--radius:14px}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Manrope,system-ui,sans-serif;font-size:15px}
h1,h2,h3,.brand{font-family:Sora,sans-serif}
button,[role=button],select,input,textarea{font-family:inherit}
button,select,input:not([type=checkbox]){min-height:40px}
a{color:var(--gold2)}
.topbar{position:sticky;top:0;z-index:40;background:#0b0b0dee;border-bottom:1px solid var(--line);backdrop-filter:blur(8px);display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
.brand{font-size:20px;font-weight:800;letter-spacing:.4px}.brand b{color:var(--gold)}
.topbar .sp{flex:1}
.btn{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:700;font-size:13.5px}
.btn:hover{border-color:var(--gold-dim)}
.btn.gold{background:var(--gold);color:#171300;border-color:var(--gold)}
.btn.danger{border-color:#5a2b24;color:#ff9a8c}
.btn.small{min-height:34px;padding:5px 10px;font-size:12.5px}
.layout{display:grid;grid-template-columns:228px 1fr;min-height:calc(100vh - 61px)}
nav.side{border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:4px;background:#0e0e10}
nav.side button{text-align:left;background:none;border:0;color:var(--muted);padding:10px 12px;border-radius:10px;cursor:pointer;font-weight:700;font-size:14px;min-height:42px}
nav.side button.on{background:#221d0e;color:var(--gold2);box-shadow:inset 2px 0 0 var(--gold)}
nav.side button:hover{color:var(--text)}
main{padding:18px;max-width:1240px;width:100%;margin:0 auto}
.view{display:none}.view.on{display:block}
.view h2{margin:2px 0 4px;font-size:24px}.sub{color:var(--muted);margin:0 0 16px;font-size:13.5px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.card .k{color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px}
.card .v{font-size:21px;font-weight:800;margin-top:5px;font-family:Sora}
.card .v.gold{color:var(--gold2)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.panel h3{margin:0 0 12px;font-size:16px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .sp{flex:1}
input,select,textarea{background:#0f0f11;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:8px 11px;font-size:14px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold-dim);border-color:var(--gold)}
label{font-size:12.5px;font-weight:700;color:var(--muted);display:block;margin-bottom:5px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;padding:8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid #222228;vertical-align:top}
tr:hover td{background:#17171a}
.tblwrap{overflow-x:auto}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:800;border:1px solid var(--line)}
.pill.av{color:var(--green);border-color:#24503a}.pill.sold{color:#c9c9c9}.pill.res{color:var(--amber);border-color:#5a451c}.pill.given{color:#7db4e8;border-color:#2c4a68}.pill.ret{color:var(--red);border-color:#5a2b24}
.pill.cr{color:var(--green)}.pill.dr{color:var(--red)}.pill.over{color:#fff;background:#7c2d20;border-color:#7c2d20}
.modal-bg{position:fixed;inset:0;background:#000a;z-index:80;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:18px 10px}
.modal-bg.on{display:flex}
.modal{background:var(--panel);border:1px solid var(--gold-dim);border-radius:16px;max-width:640px;width:100%;padding:20px}
.modal h3{margin:0 0 14px;font-size:18px}
.modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.err{background:#3a1712;border:1px solid #7c2d20;color:#ffb4a6;padding:10px 12px;border-radius:10px;font-size:13.5px;margin-bottom:12px;display:none}
.okmsg{background:#12301f;border:1px solid #24503a;color:#9fe8c0;padding:10px 12px;border-radius:10px;font-size:13.5px;margin-bottom:12px;display:none}
.imei-wrap{display:flex;gap:6px}.imei-wrap input{flex:1}
.iconbtn{flex:0 0 auto;width:44px;background:#221d0e;border:1px solid var(--gold-dim);color:var(--gold2);border-radius:10px;cursor:pointer;font-size:17px}
.kpis{display:flex;gap:18px;flex-wrap:wrap}.kpis div b{display:block;font-size:18px;font-family:Sora}
.mut{color:var(--muted);font-size:12.5px}
#lock{position:fixed;inset:0;background:var(--bg);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
#lock .box{max-width:360px;width:100%;text-align:center}
#lock input{text-align:center;font-size:22px;letter-spacing:8px}
#scannerModal .modal{max-width:560px}
.scanframe{position:relative;border-radius:12px;overflow:hidden;background:#000}
.scanframe video{width:100%;display:block;max-height:380px;object-fit:cover}
.scanframe .frame{position:absolute;inset:18% 10%;border:2px solid var(--gold);border-radius:12px;pointer-events:none;box-shadow:0 0 0 999px #00000055}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#666;margin-right:6px}.dot.live{background:var(--green)}
footer{padding:18px;text-align:center;color:var(--muted);font-size:12.5px;border-top:1px solid var(--line)}
@media(max-width:820px){.layout{grid-template-columns:1fr}nav.side{flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line)}nav.side button{flex:1 1 30%;text-align:center;font-size:12.5px;padding:8px 4px}main{padding:14px}.card .v{font-size:18px}}
@media print{body *{visibility:hidden}#printArea,#printArea *{visibility:visible}#printArea{position:absolute;inset:0;background:#fff;color:#000;padding:24px}}
</style>
</head>
<body>
<div id="lock"><div class="box">

<div class="modal-bg" id="scannerModal"><div class="modal">

<div class="fgrid" style="margin-top:10px">

<button class="btn" id="btnScanNext" style="display:none">Scan Next Phone</button>
<button class="btn" id="btnScanClose">Cancel</button>
</div>
</div></div>

<script>
"use strict";
/* ============ CellDot Shop — phone version. All data in localStorage on this device. ============ */
var LS_KEY="celldot_db_v1";
var CATS=["Shop Rent","Electricity Bills","Internet Bills","Staff Salaries","Food","Transportation","Mobile Repairs","Other Expenses"];
function blankDB(){return {pinHash:"",cashOpening:0,inventory:[],sales:[],purchases:[],accounts:[],shops:[],shopTx:[],borrowed:[],lent:[],customers:[],suppliers:[],expenses:[],expenseCats:CATS.slice(),ledger:[],closings:[],audit:[],seq:{inv:1,sale:1,ledger:1,tx:1}};}
var DB;
function load(){try{var raw=localStorage.getItem(LS_KEY);DB=raw?JSON.parse(raw):blankDB();if(!DB.expenseCats||!DB.expenseCats.length)DB.expenseCats=CATS.slice();}catch(e){DB=blankDB();}}
function save(){try{localStorage.setItem(LS_KEY,JSON.stringify(DB));}catch(e){alert2("Storage full — export a backup from Settings.");}}
function uid(p){return p+"-"+Date.now().toString(36)+"-"+Math.floor(Math.random()*9999);}
function fmt(n){n=Math.round(Number(n)||0);return "Rs "+n.toLocaleString("en-PK");}
function num(v){var n=parseFloat(v);return isNaN(n)?0:n;}
function todayStr(d){d=d||new Date();return d.toISOString().slice(0,10);}
function isToday(ds){return ds&&ds.slice(0,10)===todayStr();}
function isMonth(ds){return ds&&ds.slice(0,7)===todayStr().slice(0,7);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function luhnOk(s){s=String(s||"").replace(/\D/g,"");if(s.length!==15)return false;var sum=0;for(var i=0;i<15;i++){var d=+s[i];if(i%2===1){d*=2;if(d>9)d-=9;}sum+=d;}return sum%10===0;}
function imeiCheck(s){s=String(s||"").replace(/\D/g,"");if(s.length!==15)return {ok:false,msg:"IMEI must be exactly 15 digits (got "+s.length+")."};if(!luhnOk(s))return {ok:false,msg:"IMEI failed the Luhn checksum — please check the digits."};return {ok:true,imei:s};}
function findImei(s,excludeId){s=String(s||"").replace(/\D/g,"");if(!s)return null;for(var i=0;i<DB.inventory.length;i++){var p=DB.inventory[i];if(excludeId&&p.id===excludeId)continue;if(p.imei1===s||p.imei2===s)return p;}return null;}
function statusLabel(st){return {"Available":"Available Stock","Sold":"Sold","Reserved":"Reserved","Given":"Given to Another Shop","Returned":"Returned"}[st]||st;}
function hashPin(pin){var h=0;for(var i=0;i<pin.length;i++){h=(h*31+pin.charCodeAt(i))|0;}return "h"+h;}
function audit(action,detail){DB.audit.unshift({id:uid("A"),at:new Date().toISOString(),action:action,detail:detail});if(DB.audit.length>500)DB.audit.length=500;}
/* ---- Ledger: single source of truth for cash & account balances. DC: Credit = money in, Debit = money out. ---- */
function postLedger(o){var e={id:"TX-"+(DB.seq.ledger++),at:o.at||new Date().toISOString(),type:o.type,account:o.account||"Cash",accountId:o.accountId||"",amount:Math.abs(num(o.amount)),dc:o.dc,desc:o.desc||"",ref:o.ref||"",related:o.related||"",reversalOf:o.reversalOf||"",reversed:false,srcId:o.srcId||"",transferId:o.transferId||""};DB.ledger.unshift(e);return e;}
function cashBalance(){var b=num(DB.cashOpening);DB.ledger.forEach(function(e){if(e.account==="Cash"){b+= e.dc==="Credit"?e.amount:-e.amount;}});return b;}
function accBalance(a){var b=num(a.opening);DB.ledger.forEach(function(e){if(e.accountId===a.id){b+= e.dc==="Credit"?e.amount:-e.amount;}});return b;}
function totalOnline(){return DB.accounts.reduce(function(s,a){return s+accBalance(a);},0);}
function payTarget(method,accountId){if(method==="Cash")return {account:"Cash",accountId:""};var a=DB.accounts.filter(function(x){return x.id===accountId;})[0]||DB.accounts[0];if(a)return {account:a.name,accountId:a.id};return null;}
var NOACC_MSG="No online account matches this payment method. Add a JazzCash, EasyPaisa or bank account first (Online Accounts), then try again.";
function dash(){
 var avail=DB.inventory.filter(function(p){return p.status==="Available";});
 var settledDeals=DB.shopTx.filter(function(t){return !t.returned&&num(t.agreed)>0&&num(t.received)>=num(t.agreed);});
 var settledIds={};settledDeals.forEach(function(t){settledIds[t.phoneId]=true;});
 var given=DB.inventory.filter(function(p){return p.status==="Given"&&!settledIds[p.id];});
 var stockVal=avail.reduce(function(s,p){return s+num(p.purchasePrice);},0)+given.reduce(function(s,p){return s+num(p.purchasePrice);},0);
 var cash=cashBalance(),online=totalOnline();
 var recvCust=DB.sales.reduce(function(s,x){return s+Math.max(0,num(x.total)-num(x.received));},0);
 var recvLent=DB.lent.reduce(function(s,x){return s+Math.max(0,num(x.amount)-num(x.returned));},0);
 var recvShops=DB.shops.reduce(function(s,sh){return s+num(sh.opening);},0)+DB.shopTx.filter(function(t){return !t.returned;}).reduce(function(s,t){return s+Math.max(0,num(t.agreed)-num(t.received));},0);
 var paySupp=DB.purchases.reduce(function(s,x){return s+Math.max(0,num(x.price)-num(x.paid));},0);
 var payBorr=DB.borrowed.reduce(function(s,x){return s+Math.max(0,num(x.amount)-num(x.repaid));},0);
 var toReceive=recvCust+recvLent+recvShops, toPay=paySupp+payBorr;
 var assets=stockVal+cash+online+toReceive;
 var tSales=DB.sales.filter(function(x){return isToday(x.date);});
 var todaySales=tSales.reduce(function(s,x){return s+num(x.total);},0);
 var todayProfit=tSales.reduce(function(s,x){return s+(num(x.total)-num(x.cost));},0)+settledDeals.filter(function(t){return isToday(t.settledDate||t.date);}).reduce(function(s,t){return s+(num(t.agreed)-num(t.cost));},0);
 var monthSales=DB.sales.filter(function(x){return isMonth(x.date);}).reduce(function(s,x){return s+num(x.total);},0);
 var monthExp=DB.expenses.filter(function(x){return isMonth(x.date);}).reduce(function(s,x){return s+num(x.amount);},0);
 var grossProfit=DB.sales.reduce(function(s,x){return s+(num(x.total)-num(x.cost));},0)+settledDeals.reduce(function(s,t){return s+(num(t.agreed)-num(t.cost));},0);
 var totalExp=DB.expenses.reduce(function(s,x){return s+num(x.amount);},0);
 return {stockCount:avail.length,stockVal:stockVal,cash:cash,online:online,assets:assets,toReceive:toReceive,toPay:toPay,givenCount:given.length,todaySales:todaySales,todayProfit:todayProfit,monthSales:monthSales,monthExp:monthExp,netProfit:grossProfit-totalExp,recvCust:recvCust,recvLent:recvLent,recvShops:recvShops,paySupp:paySupp,payBorr:payBorr};
}
function ensureParty(list,name,phone,address){if(!name)return null;var ex=DB[list].filter(function(p){return p.name.toLowerCase()===name.toLowerCase();})[0];if(ex){if(phone&&!ex.phone)ex.phone=phone;return ex;}var p={id:uid("P"),name:name,phone:phone||"",address:address||""};DB[list].push(p);return p;}
</script>
<script>
/* ================= UI framework ================= */
var NAV=[["dashboard","🏠 Dashboard"],["inventory","📱 Inventory"],["sales","🧾 Sales"],["purchases","🛒 Purchases"],["cash","💵 Cash"],["accounts","🏦 Online Accounts"],["shops","🏪 Other Shops"],["borrowed","🤝 Borrowed (I Owe)"],["lent","💸 Lent (Owed to Me)"],["parties","👥 Customers & Suppliers"],["expenses","🧮 Expenses"],["reports","📊 Reports"],["ledger","📒 Ledger"],["closing","🌙 Day Closing"],["verify","🔍 Stock Verification"],["settings","⚙️ Settings & Backup"]];
var curView="dashboard";
var navEl=document.getElementById("sideNav"),mainEl=document.getElementById("main");
NAV.forEach(function(n){var b=document.createElement("button");b.textContent=n[1];b.dataset.view=n[0];b.addEventListener("click",function(){go(n[0]);});navEl.appendChild(b);});
function go(v){curView=v;render();}
function alert2(m){showModal("<h3>Notice</h3><p>"+esc(m)+"</p><div class='row'><button class='btn gold' onclick='closeModal()'>OK</button></div>");}
function showModal(html){document.getElementById("modalBox").innerHTML=html;document.getElementById("modalBg").classList.add("on");}
function closeModal(){document.getElementById("modalBg").classList.remove("on");}
document.getElementById("modalBg").addEventListener("click",function(e){if(e.target===this)closeModal();});
function field(label,inner){return "<div><label>"+label+"</label>"+inner+"</div>";}
function inp(id,val,type,ph){return "<input id='"+id+"' type='"+(type||"text")+"' value='"+esc(val==null?"":val)+"' placeholder='"+esc(ph||"")+"'/>";}
function sel(id,opts,val){return "<select id='"+id+"'>"+opts.map(function(o){var v=Array.isArray(o)?o[0]:o,t=Array.isArray(o)?o[1]:o;return "<option value='"+esc(v)+"'"+(String(v)===String(val)?" selected":"")+">"+esc(t)+"</option>";}).join("")+"</select>";}
function imeiField(id,val,label){return "<div><label>"+(label||"IMEI Number 1")+"</label><div class='imei-wrap'><input id='"+id+"' value='"+esc(val||"")+"' inputmode='numeric' placeholder='15-digit IMEI'/><button type='button' class='iconbtn' title='Scan IMEI using camera' onclick=\"openScanner('"+id+"')\">📷</button></div><span class='mut'>Scan IMEI using camera, or enter IMEI manually.</span></div>";}
function gv(id){var e=document.getElementById(id);return e?e.value.trim():"";}
function download(name,content,type){var b=new Blob([content],{type:type||"text/plain"});var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(function(){URL.revokeObjectURL(a.href);},2000);}
function csvOf(rows){return rows.map(function(r){return r.map(function(c){c=String(c==null?"":c);return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c;}).join(",");}).join("\n");}
function render(){
 Array.prototype.forEach.call(navEl.children,function(b){b.classList.toggle("on",b.dataset.view===curView);});
 document.getElementById("hdrDate").textContent=new Date().toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",year:"numeric"});
 var fn={dashboard:vDash,inventory:vInv,sales:vSales,purchases:vPur,cash:vCash,accounts:vAcc,shops:vShops,borrowed:vBorr,lent:vLent,parties:vParties,expenses:vExp,reports:vReports,ledger:vLedger,closing:vClosing,verify:vVerify,settings:vSettings}[curView];
 mainEl.innerHTML="";fn(mainEl);
}
function head(t,sub){return "<h2>"+t+"</h2><p class='sub'>"+sub+"</p>";}
function tbl(cols,rows,emptyMsg){if(!rows.length)return "<p class='mut'>"+(emptyMsg||"Nothing here yet.")+"</p>";return "<div class='tblwrap'><table><thead><tr>"+cols.map(function(c){return "<th>"+c+"</th>";}).join("")+"</tr></thead><tbody>"+rows.join("")+"</tbody></table></div>";}
function pillStatus(st){var m={Available:"av",Sold:"sold",Reserved:"res",Given:"given",Returned:"ret"};return "<span class='pill "+(m[st]||"")+"'>"+esc(statusLabel(st))+"</span>";}
/* ================= Dashboard ================= */
function vDash(el){var d=dash();
 var cards=[["Phones in Stock",d.stockCount,""],["Stock Purchase Value",fmt(d.stockVal),""],["Cash in Hand",fmt(d.cash),"gold"],["Online Accounts",fmt(d.online),""],["Total Business Assets",fmt(d.assets),"gold"],["To Receive",fmt(d.toReceive),""],["To Pay",fmt(d.toPay),""],["Phones Given to Other Shops",d.givenCount,""],["Today's Sales",fmt(d.todaySales),""],["Today's Profit",fmt(d.todayProfit),"gold"],["Monthly Sales",fmt(d.monthSales),""],["Monthly Expenses",fmt(d.monthExp),""],["Overall Net Profit",fmt(d.netProfit),"gold"]];
 var overdueB=DB.borrowed.filter(function(x){return x.due&&x.due<todayStr()&&num(x.amount)>num(x.repaid);});

 document.getElementById("fileRestore").addEventListener("change",function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);if(!d||!Array.isArray(d.inventory)||!Array.isArray(d.ledger))throw new Error("bad");DB=Object.assign(blankDB(),d);save();audit("Backup restored",f.name);render();alert2("Backup restored successfully.");}catch(e){alert2("That file is not a valid CellDot Shop backup.");}};r.readAsText(f);});
 document.getElementById("btnSetPin").addEventListener("click",function(){var a=gv("set_pin"),b=gv("set_pin2");if(!/^\d{4,8}$/.test(a)){alert2("PIN must be 4–8 digits.");return;}if(a!==b){alert2("PINs do not match.");return;}DB.pinHash=hashPin(a);save();render();alert2("PIN set. It will be asked when the app opens.");});
 var cp=document.getElementById("btnClearPin");if(cp)cp.addEventListener("click",function(){DB.pinHash="";save();render();});
 document.getElementById("btnWipe").addEventListener("click",function(){showModal("<h3>Erase all data?</h3><p>This deletes every record stored on this device. Download a backup first if you need the data.</p><div class='row'><button class='btn' onclick='closeModal()'>Cancel</button><button class='btn danger' onclick='doWipe()'>Erase Everything</button></div>");});
}
function doWipe(){var pin=DB.pinHash;DB=blankDB();DB.pinHash=pin;save();closeModal();go("dashboard");}
function doBackup(){download("celldot-backup-"+todayStr()+".json",JSON.stringify(DB,null,2),"application/json");}
document.getElementById("btnBackupTop").addEventListener("click",doBackup);
document.getElementById("btnLockTop").addEventListener("click",function(){if(DB.pinHash)showLock(false);else{go("settings");alert2("No PIN is set yet — set one here to enable the lock screen.");}});
/* ================= PIN lock ================= */
function showLock(setup){var lock=document.getElementById("lock");lock.style.display="flex";
 document.getElementById("lockMsg").textContent=setup?"Set a PIN to protect CellDot Shop on this device.":"Enter your PIN to open the shop.";
 document.getElementById("pinBtn").textContent=setup?"Set PIN & Open":"Unlock";
 document.getElementById("lockHint").textContent=setup?"You can change or remove it later in Settings.":"";
 document.getElementById("pinInput").value="";}
function tryPin(){var v=document.getElementById("pinInput").value.trim();var err=document.getElementById("lockErr");
 if(!DB.pinHash){if(!/^\d{4,8}$/.test(v)){err.textContent="PIN must be 4–8 digits.";err.style.display="block";return;}DB.pinHash=hashPin(v);save();document.getElementById("lock").style.display="none";render();return;}
 if(hashPin(v)===DB.pinHash){err.style.display="none";document.getElementById("lock").style.display="none";render();}
 else{err.textContent="Wrong PIN — try again.";err.style.display="block";}}
document.getElementById("pinBtn").addEventListener("click",tryPin);
document.getElementById("pinInput").addEventListener("keydown",function(e){if(e.key==="Enter")tryPin();});
/* ================= Boot ================= */
load();render();
if(DB.pinHash)showLock(false);
</script>
<script>
/* ================= Camera IMEI Scanner (ZXing barcode + Tesseract OCR) ================= */
var scanTarget=null,scanCb=null,scanReader=null,scanTorch=false,scanBusy=false;
function scanMsg(errM,okM){var e=document.getElementById("scanErr"),o=document.getElementById("scanOk");e.style.display=errM?"block":"none";e.textContent=errM||"";o.style.display=okM?"block":"none";o.textContent=okM||"";}
function openScanner(targetId,cb){scanTarget=targetId;scanCb=cb||null;document.getElementById("scannerModal").classList.add("on");
 document.getElementById("scanResult").style.display="none";document.getElementById("btnScanAccept").style.display="none";document.getElementById("btnScanNext").style.display="none";
 document.getElementById("foundImei1").value="";document.getElementById("foundImei2").value="";scanMsg("","");
 document.getElementById("scanStatus").textContent="Starting camera…";startScan();}
function extractImeis(text){var found=[];if(!text)return found;var digits=String(text).replace(/\D/g," ");
 var groups=String(text).match(/\d[\d\s-]{13,}\d/g)||[];
 var pools=[String(text).replace(/\D/g,"")].concat(groups.map(function(g){return g.replace(/\D/g,"");}));
 pools.forEach(function(pool){var i=0;while(i+15<=pool.length&&found.length<2){var cand=pool.slice(i,i+15);if(luhnOk(cand)){if(found.indexOf(cand)<0)found.push(cand);i+=15;}else i++;}});
 return found;}
function onImeiFound(list,source){if(!list.length)return;stopScan();
 document.getElementById("scanDot").className="dot live";
 var dupNote="";
 list.forEach(function(im){var p=findImei(im);if(p)dupNote+=" IMEI "+im+" is already registered: "+p.brand+" "+p.model+" — "+statusLabel(p.status)+".";});
 document.getElementById("foundImei1").value=list[0];document.getElementById("foundImei2").value=list[1]||"";
 document.getElementById("foundNote").textContent=dupNote||"Luhn checksum OK. Review the number, then Accept, edit it, or rescan.";
 document.getElementById("scanResult").style.display="block";document.getElementById("btnScanAccept").style.display="";document.getElementById("btnScanNext").style.display="";
 document.getElementById("scanStatus").textContent="Detected via "+source+". Scanning stopped.";
 scanMsg("",dupNote?"⚠ Duplicate found — see note below the IMEI fields.":"IMEI detected successfully.");}
function startScan(){scanMsg("","");
 if(typeof ZXing==="undefined"){scanMsg("Barcode library could not load (needs internet once). You can still type the IMEI manually.","");document.getElementById("scanStatus").textContent="Scanner library unavailable — manual entry fallback.";return;}
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){scanMsg("Camera is not available on this device/browser. Please enter the IMEI manually.","");return;}
 try{scanReader=new ZXing.BrowserMultiFormatReader();scanBusy=false;
  scanReader.decodeFromVideoDevice(null,"scanVideo",function(result,err){
   if(result&&!scanBusy){var list=extractImeis(result.getText());if(list.length){scanBusy=true;onImeiFound(list,"barcode / QR ("+(result.getBarcodeFormat?result.getBarcodeFormat():"scan")+")");}}
  }).then(function(){document.getElementById("scanDot").className="dot live";document.getElementById("scanStatus").textContent="Scanning… point the camera at the IMEI barcode, QR code or label.";}).catch(function(e){scanMsg("Camera permission denied or camera busy ("+e.message+"). Allow camera access, or enter the IMEI manually.","");document.getElementById("scanStatus").textContent="Camera unavailable — manual entry fallback.";});
 }catch(e){scanMsg("Could not start the camera: "+e.message,"");}}
function stopScan(){try{if(scanReader)scanReader.reset();}catch(e){}var v=document.getElementById("scanVideo");if(v.srcObject){v.srcObject.getTracks().forEach(function(t){t.stop();});v.srcObject=null;}document.getElementById("scanDot").className="dot";}
function videoTrack(){var v=document.getElementById("scanVideo");if(v.srcObject&&v.srcObject.getVideoTracks().length)return v.srcObject.getVideoTracks()[0];return null;}
document.getElementById("btnScanStart").addEventListener("click",function(){document.getElementById("scanResult").style.display="none";document.getElementById("btnScanAccept").style.display="none";document.getElementById("btnScanNext").style.display="none";startScan();});
document.getElementById("btnScanNext").addEventListener("click",function(){document.getElementById("scanResult").style.display="none";document.getElementById("btnScanAccept").style.display="none";document.getElementById("btnScanNext").style.display="none";scanMsg("","");startScan();});
document.getElementById("btnScanClose").addEventListener("click",function(){stopScan();document.getElementById("scannerModal").classList.remove("on");});
document.getElementById("btnTorch").addEventListener("click",function(){var t=videoTrack();if(!t){scanMsg("Start the camera first — flashlight needs a live camera.","");return;}scanTorch=!scanTorch;var btn=this;
 t.applyConstraints({advanced:[{torch:scanTorch}]}).then(function(){btn.textContent="Torch: "+(scanTorch?"On":"Off");}).catch(function(){scanTorch=false;scanMsg("Flashlight is not supported on this camera.","");});});
document.getElementById("scanZoom").addEventListener("change",function(){var t=videoTrack();if(!t)return;var z=parseFloat(this.value);t.applyConstraints({advanced:[{zoom:z}]}).catch(function(){try{t.applyConstraints({zoom:z});}catch(e){}});});
document.getElementById("btnOcr").addEventListener("click",function(){var v=document.getElementById("scanVideo");if(!v.videoWidth){scanMsg("Start the camera first, then use Capture & OCR on a printed IMEI number.","");return;}
 if(typeof Tesseract==="undefined"){scanMsg("OCR library could not load (needs internet once). Barcode scanning still works.","");return;}
 var c=document.createElement("canvas");c.width=v.videoWidth;c.height=v.videoHeight;c.getContext("2d").drawImage(v,0,0);
 document.getElementById("scanStatus").textContent="Running OCR on the captured frame…";scanMsg("","");
 Tesseract.recognize(c,"eng").then(function(res){var list=extractImeis(res.data.text);if(list.length){scanBusy=true;onImeiFound(list,"OCR (printed number)");}else{scanMsg("OCR could not find a valid 15-digit IMEI in that frame. Move closer, keep the label flat and well lit, then try again.","");document.getElementById("scanStatus").textContent="OCR finished — no valid IMEI found.";}}).catch(function(e){scanMsg("OCR failed: "+e.message,"");});});
document.getElementById("btnScanAccept").addEventListener("click",function(){var i1=imeiCheck(document.getElementById("foundImei1").value);if(!i1.ok){scanMsg(i1.msg,"");return;}
 var i2raw=document.getElementById("foundImei2").value.trim();var i2=i2raw?imeiCheck(i2raw):null;if(i2&&!i2.ok){scanMsg("IMEI 2: "+i2.msg,"");return;}
 var tgt=document.getElementById(scanTarget);if(tgt)tgt.value=i1.imei;
 if(i2&&scanTarget){var base=scanTarget.replace(/imei1/i,"imei2");var t2=document.getElementById(base);if(t2&&base!==scanTarget)t2.value=i2.imei;}
 stopScan();document.getElementById("scannerModal").classList.remove("on");
 if(scanCb){var cb=scanCb;scanCb=null;cb();}});
</script>
</body>
</html>
